[env:waveshare_lcd_4]
; Waveshare ESP32-S3-Touch-LCD-4: 480x480 ST7701 over RGB parallel + GT911.
; Same SoC/PSRAM class as the S3 AMOLED boards, so the block mirrors
; waveshare_amoled_18 minus XPowers/SensorLib (no PMU, no IMU here). The RGB
; framebuffer lives in PSRAM, so BOARD_HAS_PSRAM + qio_opi are mandatory.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
; One 7.9 MB factory app instead of default_16MB's two 6.25 MB OTA slots: the big
; tier with the culture batch is 6.8 MB and did not fit app0 (103.9 %). Nothing on
; this board uses OTA or a filesystem (settings live in NVS through Preferences),
; and nvs keeps its offset and size (0x9000, 0x5000), so bonds, Wi-Fi credentials
; and brightness should survive the next flash, which also writes the new table.
; The platform sizes the program against an ota_0 slot only, so name the factory
; slot here or the size check would measure against the whole 16 MB chip.
board_build.partitions = max_app_8MB.csv
board_build.app_partition_name = app0
upload_speed = 921600
monitor_speed = 115200

build_src_filter =
    +<*>
    -<boards/>
    +<boards/waveshare_lcd_4/>

build_flags =
    -DBOARD_LCD_4
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    ; NimBLE config — see waveshare_amoled_216 for the rationale
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER=1
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL=1
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL=0
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER=0
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
    -DMYNEWT_VAL_BLE_SVC_GAP_PPCP_MIN_CONN_INTERVAL=12
    -DMYNEWT_VAL_BLE_SVC_GAP_PPCP_MAX_CONN_INTERVAL=24
    -DMYNEWT_VAL_BLE_SVC_GAP_PPCP_SLAVE_LATENCY=0
    -DMYNEWT_VAL_BLE_SVC_GAP_PPCP_SUPERVISION_TMO=600
    ; LVGL config via build flags
    -DLV_CONF_SKIP
    -DLV_COLOR_DEPTH=16
    -DLV_USE_LOG=0
    -DLV_USE_BAR=1
    -DLV_USE_LABEL=1
    -DLV_USE_ARC=1
    -DLV_USE_BTN=1
    -DLV_USE_LINE=1
    -DLV_USE_OBJ=1
    -DLV_USE_IMG=1
    -DLV_USE_IMAGE=1
    -DLV_USE_ANIMIMG=0
    -DLV_TICK_CUSTOM=1
    -DLV_USE_SNAPSHOT=1
    ; Album art on the music card: Wi-Fi station plus JPEG fetch (wifi_link.cpp,
    ; art.cpp). This env only; every other env compiles those files to nothing.
    -DFEATURE_PICTURE=1
    ; The big tier of the splash table (tier: 'big' in docs/bench/anims.js, the
    ; mushroom HDs and the big sky mushroom): their data and rows sit inside
    ; #ifdef SPLASH_BIG (tools/add_echo_anims.py). This env only, on its 16 MB
    ; layout; the stock 2.16 partition has no room for them.
    -DSPLASH_BIG=1

lib_deps =
    ; 1.6.4+ carries Arduino_ESP32RGBPanel / Arduino_RGB_Display on core 3.x
    moononournation/GFX Library for Arduino@^1.6.4
    lvgl/lvgl@^9.2.0
    bblanchon/ArduinoJson@^7.0.0
    h2zero/NimBLE-Arduino@^2.1.1
    ; QMI8658 breakout on the I2C header for auto-rotate (imu.cpp)
    lewisxhe/SensorLib@^0.2.6
    ; Album art (FEATURE_PICTURE): wifi_link.cpp and art.cpp include these
    ; through macros, out of sight of the library finder, so envs without the
    ; flag never build or link the Wi-Fi stack; this env names them instead,
    ; with the two the finder would have found under them (Networking is the
    ; core's Network folder).
    WiFi
    Networking
    HTTPClient
    NetworkClientSecure
    bitbank2/JPEGDEC@^1.8.4
; JPEGDEC names bb_spi_lcd as a dependency for its JPEGDisplay helper, which
; this build never includes; keep that display library out of the compile.
lib_ignore =
    bb_spi_lcd
